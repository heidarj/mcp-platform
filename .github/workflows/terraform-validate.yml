name: Terraform validate

on:
  workflow_call:
    inputs:
      terraform_directory:
        description: Terraform directory in the caller repository.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir="${{ inputs.terraform_directory }}" fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir="${{ inputs.terraform_directory }}" init -backend=false

      - name: Validate Terraform
        run: terraform -chdir="${{ inputs.terraform_directory }}" validate
